<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SG Food Hunt</title>
<meta name="description" content="Where to eat in Singapore this weekend: cafes, zi char, hawker stalls and celebration dinners, ranked daily from the food blogs.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='20' height='20' rx='4' transform='rotate(45 16 16)' fill='%23c43a26'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="wrap" style="display:flex;align-items:center;gap:1rem;">
    <a class="brand" href="#"><span class="mark" aria-hidden="true"></span>SG Food Hunt</a>
    <label class="search">
      <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
      <span class="visually-hidden">Search venues</span>
      <input id="q" type="search" placeholder="Search a place, cuisine or MRT" autocomplete="off">
    </label>
    <a class="promos-link" href="#promos" id="promos-link" data-count="0"><i class="ph ph-gift" aria-hidden="true"></i><span>Promos</span></a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <h1>Where to eat <em>this weekend.</em></h1>
      <p id="lede">Loading the latest run…</p>
      <ul class="groups" id="groups" aria-label="Lists"></ul>
    </div>
    <div class="map-wrap">
      <div id="map" role="region" aria-label="Map of the places in this list"></div>
      <div class="map-note" id="map-note"></div>
    </div>
  </section>

  <section class="changes" id="changes" hidden>
    <h2><i class="ph ph-fill ph-lightning" aria-hidden="true"></i> Since the last run</h2>
    <ul id="changes-list"></ul>
  </section>

  <section id="list-view">
    <div class="list-head">
      <h2 id="list-title">Cafes &amp; brunch</h2>
      <span class="count" id="list-count"></span>
    </div>
    <ul class="tabs" id="tabs" role="tablist"></ul>
    <div class="filters" id="filters">
      <label><input type="checkbox" id="f-worth"> Worth going only</label>
      <label>Region
        <select id="f-region"><option value="">Any</option><option>Central</option><option>East</option><option>North</option><option>North East</option><option>West</option></select>
      </label>
      <label>Price
        <select id="f-price"><option value="">Any</option><option value="1">$ about S$15</option><option value="2">$$ about S$35</option><option value="3">$$$ about S$80</option><option value="4">$$$$ S$160 and up</option></select>
      </label>
      <label><input type="checkbox" id="f-halal"> Halal</label>
      <label><input type="checkbox" id="f-weekend"> Open weekends</label>
      <label><input type="checkbox" id="f-michelin"> Michelin</label>
      <label><input type="checkbox" id="f-new"> New</label>
      <button class="reset" id="f-reset" type="button">Reset</button>
    </div>
    <ul class="rows" id="rows"></ul>
    <button class="more" id="more" type="button" hidden>Show more</button>
  </section>

  <section id="promos-view" hidden>
    <div class="list-head">
      <h2>Promos at your places</h2>
      <span class="count" id="promos-count"></span>
    </div>
    <p id="promos-note" style="color:var(--ink-2);margin:0 0 1rem;">Found by web search for the places on these lists. Each deal links to its source. Check it before you go.</p>
    <ul class="deals" id="deals"></ul>
  </section>

  <footer id="foot"></footer>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Venue details">
  <button class="close" id="close" type="button" aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>
  <div id="drawer-body"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
