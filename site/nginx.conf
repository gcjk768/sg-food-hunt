# SG Food Hunt website (food-site container). "no-cache" makes browsers check for a newer page or
# data.json on every visit (a cheap ETag check), so the daily rebuild shows at once.
server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;
    location / {
        index index.html;
        add_header Cache-Control "no-cache";
    }
    location = /nginx.conf { return 404; }
}
