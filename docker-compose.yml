# SG Food Hunt on the NAS (Dockge stack). Weekly run; the diff goes to the owner Channel topic 159 (Food Hunt).
# Claude: log in once from the container terminal (`claude`, then /login), same as trading-desk.
services:
  sgfoodhunt:
    networks: [default, scrape-net]   # shared Playwright server ws://playwright:3000/
    build:
      context: . # this folder is the source of truth (nas-sync pushes it to GitHub main); bump the tag to rebuild
      args:
        WITH_CLAUDE: "true"
    image: sgfoodhunt:20261017-michelin
    container_name: sgfoodhunt
    # uid 0 keeps the shared Claude login (/app/claude-config: root 600, rewritten by trading-desk) usable;
    # gid 10 (admin) + umask 002 in the entrypoint make every written file editable by the owner (664/775).
    user: "0:10"
    restart: unless-stopped
    env_file: .env # TELEGRAM_BOT_TOKEN (+ optional GOOGLE_PLACES_API_KEY etc.)
    environment:
      PLAYWRIGHT_WS_URL: ws://playwright:3000/
      TZ: Asia/Singapore
      SGFH_SCHEDULE: daily 08:00
      SGFH_RUN_ON_START: "false"
      TELEGRAM_CHAT_ID: "<TELEGRAM_CHAT_ID>"
      TELEGRAM_THREAD_ID: "<THREAD_ID>"
      # Text-only AI calls go to Ollama (slow is fine, saves Claude limit); web-search calls still use Claude.
      SHIM_REAL: /usr/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe
      OLLAMA_URL: http://<LAN_IP>:11434
      OLLAMA_MODEL: gpt-oss:20b
      SHIM_TIMEOUT: "3000"
      SHIM_FALLBACK: unreachable
      SHIM_LOG: /app/logs/ollama-shim.log
    volumes:
      - ./config:/app/config
      - /volume1/docker/ollama/shim:/shim:ro # claude -p stand-in that answers from Ollama (settings.yaml claude_bin)
      - ./data:/app/data
      - ./logs:/app/logs
      - ./social_exports:/app/social_exports
      - /volume1/docker/trading-desk/.home/.claude:/app/claude-config # Claude CLI login lives here
      - "/volume1/<USER>/Obsidian/SG Food Hunt:/app/vault/SG Food Hunt" # this app folder only
    stdin_open: true # so the Dockge terminal can run `claude` interactively
    tty: true
    mem_limit: 1536m
    healthcheck:
      # host is IO-loaded; doctor needs 40-90s just to import, image default is 20s
      test:
        - CMD-SHELL
        - sgfh doctor -C /app/config --quiet || exit 1
      interval: 5m
      timeout: 180s
      start_period: 3m
  # Website: site/index.html plus data/site/data.json, which sgfh rewrites after every run (sgfh site).
  # LAN: http://<LAN_IP>:8783. Same shape as the property site (nginx + two read-only mounts).
  food-site:
    image: nginx:1.27-alpine
    container_name: food-site
    ports:
      - "8783:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./data/site:/usr/share/nginx/html/live:ro
      - ./site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  scrape-net:
    external: true