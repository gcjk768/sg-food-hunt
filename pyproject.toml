[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgfoodhunt"
version = "0.1.0"
description = "Collects, ranks and keeps fresh a list of dining venues in Singapore for dates and family occasions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.5",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dashboard = ["streamlit>=1.35", "pandas>=2.2", "pydeck>=0.9"]
sheets = ["gspread>=6.0", "google-auth>=2.29"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
  "types-requests",
  "types-beautifulsoup4",
]

[project.scripts]
sgfh = "sgfoodhunt.cli:app"

[tool.setuptools.packages.find]
include = ["sgfoodhunt*"]

[tool.setuptools.package-data]
sgfoodhunt = ["py.typed", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# E501: ruff format wraps code; long strings and comments are allowed. RUF001/2: CJK punctuation.
ignore = ["RUF012", "RUF001", "RUF002", "N818", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
files = ["sgfoodhunt", "tests"]

[[tool.mypy.overrides]]
module = ["bs4.*", "rapidfuzz.*", "respx.*", "playwright.*", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_unused_ignores = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:sgfoodhunt.*"]
