      - "best tze char Singapore"
      - "新加坡 煮炒 推荐"
      - "新加坡 最好 煮炒"
    keywords: ["zi char", "zichar", "tze char", "cze char", "煮炒", "cereal prawn", "chilli crab", "har cheong gai"]
    weights: {food: 0.20, value: 0.20, space: 0.10, parking: 0.10, ambience: 0.0, weekend_open: 0.10}
    hard_filters: {open_weekends: true}

  - key: brunch_date
    display_name: Best brunch cafes for a weekend date
    group: dating
    party_size: 2
    queries:
