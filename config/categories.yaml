      - "best weekend brunch Singapore couples"
      - "brunch spots Singapore date"
      - "tiktok viral brunch Singapore"
      - "新加坡 早午餐 咖啡馆"
    keywords: ["brunch", "eggs benedict", "pancakes", "weekend"]
    weights: {ambience: 0.15, food: 0.15, service: 0.10, weekend_open: 0.15}
