      - "新加坡 小贩中心 推荐"
    keywords: ["hawker", "food court", "kopitiam", "stalls", "小贩"]
    weights: {food: 0.15, value: 0.30, space: 0.10, parking: 0.15, ambience: 0.0, service: 0.0}
