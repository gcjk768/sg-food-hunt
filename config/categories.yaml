# One entry per category. Adding a category = adding an entry here; no code change needed.
#
# Fields
#   key            stable identifier used in the database and file names
#   display_name   human label
#   group          dating | family | general   (drives default keyword lexicons and summaries)
#   party_size     assumed head count for the bill estimate
#   queries        search query variants; every variant is run against every enabled source
#   keywords       review keywords counted for this category (in addition to the group lexicon)
#   weights        ranking component weights; they are normalised at run time so they need not sum to 1
#   hard_filters   venues failing a hard filter are excluded from this category's ranking
#                  (exclude_closed, open_weekends, requires_private_room, halal_only,
#                   max_price_level, opened_within_months)
#
# Weight component names (see README "Ranking"):
#   rating, recommendations, ambience, service, food, value, space, kid_friendly,
#   parking, weekend_open, quiet, keyword_match, michelin
defaults:
  weights:
    rating: 0.30
    recommendations: 0.30
    keyword_match: 0.10
    food: 0.10
    service: 0.05
    value: 0.05
    ambience: 0.05
    space: 0.00
    kid_friendly: 0.00
    parking: 0.00
    weekend_open: 0.05
    quiet: 0.00
  hard_filters:
    exclude_closed: true
  group_keywords:
    dating: ["romantic", "date night", "date", "anniversary", "cosy", "cozy", "intimate", "couple", "proposal", "valentine"]
    family: ["family", "kids", "children", "elderly", "grandparents", "parents", "birthday", "reunion", "gathering", "toddler", "high chair"]
    general: ["new", "newly opened", "just opened", "opening", "opened", "latest", "soft launch", "新开", "新店"]

categories:
  - key: cafes_date
    display_name: Best cafes for a date
    group: dating
    party_size: 2
    queries:
      - "best cafes for a date Singapore"
      - "romantic cafes Singapore"
      - "cosy cafes Singapore couples"
      - "instagrammable cafe Singapore"
      - "tiktok viral cafe Singapore"
      - "新加坡 约会 咖啡馆"
    keywords: ["coffee", "latte", "quiet corner"]
    weights: {ambience: 0.20, service: 0.10, quiet: 0.10, space: 0.0, value: 0.05}
    hard_filters: {open_weekends: true}

  - key: restaurants_date
    display_name: Best restaurants for a date
    group: dating
    party_size: 2
    queries:
      - "best restaurants for a date night Singapore"
      - "romantic restaurants Singapore"
      - "anniversary dinner restaurants Singapore"
      - "best fine dining for couples Singapore"
      - "instagrammable restaurant Singapore"
      - "新加坡 浪漫 餐厅"
    keywords: ["wine", "tasting menu", "candlelight", "view"]
    weights: {ambience: 0.20, service: 0.15, quiet: 0.10, food: 0.15}
    hard_filters: {}

  - key: family_occasion
    display_name: Best restaurants or buffets for a family occasion
    group: family
    party_size: 6
    queries:
      - "best restaurants for family celebration Singapore"
      - "best buffets for birthday celebration Singapore"
      - "reunion dinner restaurants Singapore"
      - "restaurants for elderly parents Singapore"
      - "best anniversary dinner with family Singapore"
      - "新加坡 团圆饭 餐厅"
      - "新加坡 家庭聚餐 自助餐"
    keywords: ["buffet", "celebration", "cake", "big group"]
    weights: {space: 0.15, kid_friendly: 0.05, parking: 0.10, value: 0.10, service: 0.10}
    hard_filters: {open_weekends: true}

  - key: family_weekend
    display_name: Best restaurants for a family weekend meal
    group: family
    party_size: 4
    queries:
      - "best family restaurants Singapore weekend"
      - "kid friendly restaurants Singapore"
      - "family friendly restaurants with playground Singapore"
      - "best restaurants for family lunch Singapore"
      - "新加坡 亲子 餐厅"
    keywords: ["playground", "kids menu", "high chair", "stroller"]
    weights: {space: 0.10, kid_friendly: 0.15, parking: 0.10, value: 0.15, weekend_open: 0.10}
