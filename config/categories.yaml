      - "restaurants with private rooms Singapore"
      - "private dining rooms Singapore family celebration"
      - "restaurants with private room for birthday Singapore"
      - "新加坡 包厢 餐厅"
      - "新加坡 私人 包间 餐厅 生日"
    keywords: ["private room", "private dining", "包厢", "包间", "function room"]
    weights: {space: 0.25, service: 0.10, parking: 0.10, food: 0.10, value: 0.05}
    hard_filters: {open_weekends: true, requires_private_room: true}

  # --- "what's new" categories: recency matters more than review volume, so the rating weight
  # is lowered and recommendations (recent articles) raised. opened_within_months keeps only
  # venues whose earliest evidence (article date, first Google review, first seen by this tool)
  # falls inside the window (1 month = the last `scoring.new_within_days` days).
  - key: new_cafes
    display_name: Newly opened cafes
    group: general
    party_size: 2
    queries:
      - "new cafes Singapore 2026"
      - "newly opened cafes Singapore"
      - "new cafe openings Singapore this month"
      - "latest cafes to check out Singapore"
      - "tiktok viral new cafe Singapore"
      - "新加坡 新开 咖啡馆"
    keywords: ["cafe", "coffee", "brunch"]
    weights: {rating: 0.15, recommendations: 0.40, keyword_match: 0.15, ambience: 0.10, food: 0.10}
    hard_filters: {opened_within_months: 1}

  - key: new_restaurants
    display_name: Newly opened restaurants
    group: general
    party_size: 2
    queries:
      - "new restaurants Singapore 2026"
      - "newly opened restaurants Singapore"
      - "new restaurant openings Singapore this month"
      - "best new restaurants Singapore"
      - "instagrammable new restaurant Singapore"
      - "新加坡 新开 餐厅"
    keywords: ["restaurant", "tasting menu", "chef"]
    weights: {rating: 0.15, recommendations: 0.40, keyword_match: 0.15, food: 0.15, service: 0.05}
    hard_filters: {opened_within_months: 1}

  - key: new_zichar
