# Global settings. Secrets never go here; they live in .env (see .env.example).
paths:
  # Everything is plain files so the project can live on a NAS share (no SQLite, no locks).
  vault_dir: vault                # CHANGE ME: path to your Obsidian vault (absolute or relative)
  vault_folder: SG Food Hunt      # subfolder inside the vault that this tool owns
  data_dir: data                  # machine state: runs/, cache/ (JSON and JSONL files)
  cache_dir: data/cache
  exports_dir: data/exports       # CSV / JSON exports
  logs_dir: logs

http:
  user_agent: "sgfoodhunt/0.1 (+https://github.com/gcjk768/SG-Cafe-Food-Hunt; personal research crawler; respects robots.txt)"
  min_delay_seconds: 2.0          # polite delay between requests to the same domain
  max_delay_seconds: 5.0
  timeout_seconds: 30
  max_retries: 4
  backoff_base_seconds: 1.5       # exponential backoff: base * 2**attempt, capped below
  backoff_max_seconds: 60
  robots_cache_ttl_hours: 168     # robots.txt is re-fetched weekly
  respect_robots: true
  default_cache_ttl_hours: 168    # raw responses are reused for a week unless the source overrides

api_rate_limits:                  # requests per minute per API (official APIs only)
  google_places: 60
  reddit: 30
  data_gov_sg: 60
  onemap: 60

scoring:                          # global parameters; per-category weights live in categories.yaml
  top_n: 15
  fuzzy_match_threshold: 88       # rapidfuzz token_set_ratio needed to merge two names without a postal code
  price_per_pax_sgd: {1: 15, 2: 35, 3: 80, 4: 160}   # per price level, used for bill estimates
  new_within_days: 30             # 'newly opened' window when opened_within_months is 1
  bayesian_prior_reviews: 100     # C in the Bayesian average
  bayesian_prior_rating: 4.2      # m in the Bayesian average
  recommendation_half_life_months: 18
  recommendation_stale_after_years: 4
  michelin_bonus: 0.03
  multi_source_bonus: 0.03        # applied when >= multi_source_threshold independent sources
  multi_source_threshold: 3
  declining_trend_penalty: 0.05
  poor_hygiene_penalty: 0.10      # SFA grade C or worse
  temporarily_closed_penalty: 0.50
  buzz_bonus_max: 0.05            # social buzz can add at most 5% of the total score
  personal_rating_weight: 0.15

social:
  enabled: false
  exports_dir: social_exports
  buzz_window_months: 6
  buzz_half_life_days: 60
  trending_threshold: 5
  hashtags: []                    # max 25, only used with an Instagram Business token, e.g. [sgcafe, sgfoodie, sgfood]
  serp_sites: ["instagram.com", "tiktok.com"]
  serp_endpoint: https://serpapi.com/search.json
  serp_max_results: 10

ai:                               # optional: Claude via the Claude Code CLI (`claude -p`), off by default
  enabled: false
  provider: claude_cli            # the only provider; needs the `claude` binary and ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN
  model: claude-opus-5-5          # e.g. claude-sonnet-5-5 to cut cost by half
  effort: low                     # low | medium | high: extraction and matching are simple tasks
  claude_bin: claude
  timeout_seconds: 180
  max_calls_per_run: 200          # hard cap on CLI calls per run (cached answers do not count)
  max_budget_usd: 5.0             # stop calling once this much has been spent in one run
  cache_ttl_days: 90              # identical prompts are served from data/cache
  tasks:
    reddit_extraction: true       # venue names from Reddit threads (replaces the regex heuristics)
    article_extraction: true      # venue entries from articles the listicle parser could not split
    review_analysis: true         # aspect scores, noise level and the summary in the tool's own words
    social_matching: true         # match a social caption to a venue when fuzzy matching fails

exports:
  google_sheets: false
  csv: true
  json: true

notifications:
  telegram: false
  email: false
  rating_change_threshold: 0.2
