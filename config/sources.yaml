  - key: timeout
    name: Time Out Singapore
    kind: blog
    scraper: TimeOutScraper
    enabled: false             # 2026-09-29: search results are JS rendered and show trending links, not matches
    priority: 43
    base_url: https://www.timeout.com
    search_url: https://www.timeout.com/singapore/search?q={query}
    fetch: static
    independent: true
    tos_status: unverified
    cache_ttl_hours: 336

  - key: honeycombers
    name: Honeycombers
