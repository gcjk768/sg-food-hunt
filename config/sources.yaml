    priority: 45
    base_url: https://thesmartlocal.com
    search_url: https://thesmartlocal.com/?s={query}
    fetch: static
    independent: true
    tos_status: unverified
    cache_ttl_hours: 336

  - key: sassymama
    name: Sassy Mama Singapore
    kind: blog
    scraper: SassyMamaScraper
    enabled: true
    priority: 46
    base_url: https://www.sassymamasg.com
    search_url: https://www.sassymamasg.com/?s={query}
    fetch: static
    independent: true
    tos_status: unverified
    cache_ttl_hours: 336
    options:
      groups: [family]          # only run for family categories

  - key: tatler
    name: Tatler Dining Singapore
    kind: blog
    scraper: TatlerDiningScraper
    enabled: false             # 2026-09-29: robots.txt disallows /search
    priority: 47
    base_url: https://www.tatlerasia.com
    search_url: https://www.tatlerasia.com/search?q={query}&section=dining
    fetch: static
    independent: true
    tos_status: unverified
    cache_ttl_hours: 336

  - key: michelin
    name: Michelin Guide Singapore
    kind: guide
    scraper: MichelinScraper
    enabled: false             # 2026-09-29: robots.txt disallows the selection listing
    priority: 50
    base_url: https://guide.michelin.com
    fetch: static
    independent: true
    tos_status: unverified
    cache_ttl_hours: 720
    notes: Crawls the Singapore selection listing (stars and Bib Gourmand); not query driven.
    options:
      listing_url: https://guide.michelin.com/sg/en/selection/singapore/restaurants
      max_pages: 20

  - key: reddit
    name: Reddit (r/singapore, r/singaporeeats)
    kind: community
    scraper: RedditScraper
    enabled: true
    priority: 60
    base_url: https://oauth.reddit.com
    fetch: api
    independent: true
    tos_status: verified_ok
    cache_ttl_hours: 168
    notes: >
      Official API with OAuth client credentials. Usernames are never stored; only thread titles,
      URLs and extracted venue candidates. Needs REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET.
    options:
      subreddits: [singaporeeats, singapore]
      max_threads_per_query: 10
      max_comments_per_thread: 100
      time_filter: year

  - key: sfa
    name: Singapore Food Agency hygiene grades
    kind: government
    scraper: SfaHygieneScraper
    enabled: true
    priority: 70
    base_url: https://api-open.data.gov.sg
    fetch: api
    independent: false
    tos_status: verified_ok
    cache_ttl_hours: 720
    notes: >
      Uses the data.gov.sg open data API (Singapore Open Data Licence). The dataset id below must
      point at a current SFA/NEA "eating establishments" dataset that carries a grade column; if the
      dataset is retired the scraper logs a warning and yields nothing.
    options:
      dataset_id: d_1234567890abcdef_replace_me
      name_column: licensee_name
      address_column: premises_address
      postal_column: postal_code
      grade_column: grade

  - key: tripadvisor
    name: TripAdvisor
    kind: review_site
    scraper: TripAdvisorScraper
    enabled: false
    priority: 80
    base_url: https://www.tripadvisor.com.sg
    search_url: https://www.tripadvisor.com.sg/Search?q={query}&geo=294265
    fetch: static
    independent: true
    tos_status: disallowed
    cache_ttl_hours: 168
    notes: >
      TripAdvisor's terms prohibit automated access without a Content API licence. Disabled and marked
      disallowed until you hold a licence; set tos_status to verified_ok and enabled to true to run it.
