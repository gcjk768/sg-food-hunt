# One entry per source. `scraper` names a class registered in sgfoodhunt.scrapers.
#
# Fields
#   key              stable identifier
#   name             display name
#   kind             api | booking | aggregator | blog | guide | community | government | review_site
#   scraper          registered scraper class name
#   enabled          master switch; disabled sources are never contacted
#   priority         lower runs first (matches the priority order in the brief)
#   base_url         used for robots.txt and rate limiting
#   search_url       template for site search pages; {query} is URL encoded at run time
#   cache_ttl_hours  raw response reuse window for this source
#   fetch            static (requests + BeautifulSoup) | browser (Playwright) | api
#   independent      counts towards the "independent source recommendation" bonus
#   tos_status       verified_ok | unverified | disallowed. `unverified` sources still run, but
#                    only after the live robots.txt check passes. `disallowed` sources are skipped
#                    even if enabled. Review each site's terms yourself before enabling.
#   notes            legal / practical caveats surfaced by `sgfh sources`
#   options          scraper specific settings
sources:
  - key: google_places
    name: Google Maps (Places API)
    kind: api
    scraper: GooglePlacesScraper
    enabled: false             # 2026-09-29: owner opted out (paid API, needs billing); re-enable with GOOGLE_PLACES_API_KEY
    priority: 10
    base_url: https://places.googleapis.com
    fetch: api
    independent: false
    tos_status: verified_ok
    cache_ttl_hours: 72
    notes: >
      Official Places API (New). Needs GOOGLE_PLACES_API_KEY. Popular times are not exposed by the
      official API and are not collected. Review author data is discarded on ingest.
    options:
      region_code: SG
      language_code: en
      location_bias: {lat: 1.3521, lng: 103.8198, radius_m: 30000}
      max_pages: 3

  - key: chope
    name: Chope
    kind: booking
    scraper: ChopeScraper
    enabled: false             # 2026-09-29: search ignores the words (same 15 featured venues for any query; parser fixed, needs WITH_BROWSER)
    priority: 20
    base_url: https://www.chope.co
    search_url: https://www.chope.co/singapore-restaurants/category/restaurant/2?restaurant={query}  # from the site's SearchAction JSON-LD; old /search 404s
    fetch: browser
    independent: false
    tos_status: unverified
    cache_ttl_hours: 168
    notes: JavaScript rendered search; runs through Playwright only if robots.txt allows the path.

  - key: quandoo
    name: Quandoo
    kind: booking
    scraper: QuandooScraper
    enabled: false             # 2026-09-29: Quandoo is closing down (platform off after 2026-09-30)
    priority: 21
    base_url: https://www.quandoo.sg
    search_url: https://www.quandoo.sg/en/result?destination=singapore&query={query}
    fetch: static
    independent: false
    tos_status: unverified
    cache_ttl_hours: 168

  - key: tablecheck
    name: TableCheck
    kind: booking
    scraper: TableCheckScraper
    enabled: false             # 2026-09-29: search is a JS map that ignores the query and returns the same ~50 venues
    priority: 22
    base_url: https://www.tablecheck.com
    search_url: https://www.tablecheck.com/en/singapore/search?q={query}
    fetch: static
    independent: false
    tos_status: unverified
    cache_ttl_hours: 168

  - key: google_reserve
    name: Google Reserve
    kind: booking
    scraper: GoogleReserveScraper
    enabled: false             # 2026-09-29: owner opted out (paid API, needs billing); re-enable with GOOGLE_PLACES_API_KEY
    priority: 23
    base_url: https://places.googleapis.com
    fetch: api
    independent: false
    tos_status: verified_ok
    cache_ttl_hours: 72
    notes: >
      Derived from the Places API `reservable` flag and Google Maps URI; Google Maps itself is never
      scraped. Produces booking links only for venues already found by google_places.

  - key: burpple
    name: Burpple
    kind: aggregator
    scraper: BurppleScraper
    enabled: true
    priority: 30
    base_url: https://www.burpple.com
    search_url: https://www.burpple.com/search/sg?q={query}
    fetch: static
